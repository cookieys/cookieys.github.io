name: Update source
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apps.json from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/itzzace/ytkace/releases/latest > release.json
          jq '
            . as $r
            | ([.assets[] | select(.name | endswith(".ipa"))] | sort_by(.name)) as $ipas
            | {
                name: "My Source",
                identifier: "com.ivy.cherieivy",
                apps: [{
                  name: "YTKACE",
                  bundleIdentifier: "com.google.ios.youtube",
                  developerName: "itzzace",
                  subtitle: "YouTube enhancer",
                  localizedDescription: "YouTube enhancer with SponsorBlock, background playback and more.",
                  iconURL: "https://YOUR_ICON_URL.png",
                  versions: ([
                    $ipas | to_entries[] | .key as $i | .value as $a
                    | {
                        version: ($r.tag_name | ltrimstr("v")),
                        date: $r.published_at,
                        downloadURL: $a.browser_download_url,
                        size: $a.size,
                        localizedDescription: $r.body
                      }
                      + (if ($ipas | length) > 1
                         then (if $i == 0 then {maxOSVersion: "16.99"} else {minOSVersion: "17.0"} end)
                         else {} end)
                  ] | reverse)
                }],
                news: []
              }' release.json > apps.json
          rm release.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps.json
          git diff --cached --quiet || (git commit -m "Update source" && git push)
